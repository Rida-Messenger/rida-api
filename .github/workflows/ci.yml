name: CI

on: [push, pull_request]
    
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
    
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: "1.57.0"
      
      - name: Check code
        run: just check-ci
